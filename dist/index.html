function editRecord(id){const r=records().find(r=>r.id===id);openSheet('编辑记录',`<textarea name="text" required autofocus>${esc(r.text)}</textarea><label>分类</label><select name="category">${M.cats.map(c=>`<option ${c===r.category?'selected':''}>${c}</option>`).join('')}</select><div class="actions"><button class="primary">保存</button></div>`,f=>{if(!f.get('text').trim())return;if(mutate(()=>Object.assign(r,{text:f.get('text').trim(),category:f.get('category'),updatedAt:Date.now()})))close()})}
function picker(target){const rows=records().filter(r=>!r.done);openSheet(target==='today'?'加入今日':'选择事项',`<div class="tools"><select id="pickScope" aria-label="事项来源"><option value="all">记录仓库</option><option value="today" ${target==='timer'?'selected':''}>今日任务</option></select></div><div class="menu-list" id="pickList"></div>`);const fill=()=>{$('#pickList').innerHTML=rows.filter(r=>$('#pickScope').value!=='today'||r.today[M.day(Date.now())]).map(r=>`<button type="button" data-pick="${esc(r.id)}" data-target="${target}">${esc(r.text)}</button>`).join('')||'<p class="empty">暂无可选事项</p>'};$('#pickScope').onchange=fill;fill()}
function audioUnlock(){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume()}catch{}}
function start(){if(state.active)return;audioUnlock();if(mode==='down'&&(!Number.isFinite(planned)||planned<1||planned>10080)){toast('请输入 1—10080 分钟');return}const now=Date.now();mutate(()=>state.active={id:M.uid(),name:name.trim()||'未命名事项',taskId,mode,plannedMs:mode==='down'?planned*60000:0,start:now,running:true,segmentStart:now,accumulatedMs:0,segments:[],expectedEnd:mode==='down'?now+planned*60000:null,alerted:false})}
function tick(){const a=state.active,peek=$('#timerPeek');peek.hidden=!a||view==='timer';if(!a){if($('#digits'))$('#digits').textContent=digits(mode==='down'?planned*60000:0);return}const ms=M.elapsed(a),remaining=a.plannedMs-ms,value=a.mode==='down'?(remaining<0?'＋':'')+digits(remaining):digits(ms);if($('#digits'))$('#digits').textContent=value;if($('#expired'))$('#expired').hidden=!(a.mode==='down'&&remaining<=0);peek.textContent=`${a.running?'◷':'Ⅱ'} ${value} · ${a.name}`;if(a.mode==='down'&&remaining<=0&&!a.alerted){a.alerted=true;persist();toast('时间到了，继续计时或结束留痕');try{if(audio&&audio.state==='running')for(let i=0;i<3;i++){const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=660;g.gain.value=.12;o.start(audio.currentTime+i*.3);o.stop(audio.currentTime+i*.3+.18)}if('Notification'in window&&Notification.permission==='granted')new Notification('日迹 · 时间到了',{tag:a.id,body:a.name})}catch{}}}
function localInput(t){return new Date(t-new Date(t).getTimezoneOffset()*60000).toISOString().slice(0,23)}
function editSession(id){const s=sessions().find(s=>s.id===id);if(!s)return;openSheet('行动留痕',`<label>事项</label><input name="name" value="${esc(s.name)}"><label>开始时间</label><input type="datetime-local" step="0.001" name="start" value="${localInput(s.start)}" required><label>结束时间</label><input type="datetime-local" step="0.001" name="end" value="${localInput(s.end)}" required><label>实际有效时长（分钟）</label><input type="number" step="any" min="0" name="actual" value="${M.duration(s)/60000}" required>${s.plannedMs?`<label>计划时长（分钟）</label><input name="planned" type="number" min="1" value="${s.plannedMs/60000}">`:''}<label>完成状态</label><select name="result">${['已完成','未完成','阶段性完成'].map(x=>`<option ${x===s.result?'selected':''}>${x}</option>`).join('')}</select><label>活动分类</label><select name="activity">${['学习','创作','工作','生活','休闲'].map(x=>`<option ${x===s.activity?'selected':''}>${x}</option>`).join('')}</select><label>心得或备注</label><textarea name="note">${esc(s.note)}</textarea><div class="actions"><button type="button" class="danger" data-action="deleteSession" data-id="${esc(id)}">删除</button><button class="primary">保存</button></div>`,f=>{const start=+new Date(f.get('start')),end=+new Date(f.get('end')),actual=Number(f.get('actual'))*60000;if(!Number.isFinite(start)||end<start||!Number.isFinite(actual)||actual<0||actual>end-start+1000){toast('有效时长不能超过开始至结束的时间');return}const changed=start!==s.start||end!==s.end||Math.abs(actual-M.duration(s))>1;if(mutate(()=>{Object.assign(s,{name:f.get('name').trim()||'未命名事项',start,end,actualMs:actual,result:f.get('result'),activity:f.get('activity'),note:f.get('note'),draft:false,updatedAt:Date.now()});if(changed)s.segments=actual?[[start,start+actual]]:[];if(f.has('planned'))s.plannedMs=Number(f.get('planned'))*60000;const r=records().find(r=>r.id===s.taskId);if(r){M.complete(r,s.result==='已完成',s.end);r.updatedAt=Date.now()}}))close()})}
function backup(){const legacy=Object.fromEntries(Object.values(legacyKeys).map(k=>[k,localStorage.getItem(k)]));const blob=new Blob([JSON.stringify({app:'日迹',version:2,state,legacy,raw:readOnly?localStorage.getItem(M.KEY):undefined},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`日迹备份_${M.day(Date.now())}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function settings(){openSheet('备份与设置',`<div class="menu-list"><button type="button" data-action="backup">导出完整备份</button><button type="button" data-action="restore">恢复备份</button><button type="button" data-action="login">${user?'同步账号 · '+esc(user.email):'登录云端同步'}</button>${user?'<button type="button" data-action="sync">立即同步</button><button type="button" data-action="logout">退出登录</button>':''}<button type="button" data-action="notification">允许通知提醒</button></div><p class="stats-caption">计时按真实时间恢复。iOS 锁屏或后台挂起时，网页无法保证准时响铃；返回后会检测到期并提醒。</p><p class="stats-caption">${esc(cloudStatus)}</p>`)}
function merge(remote){for(const k of ['records','sessions']){const map=new Map(state[k].map(x=>[x.id,x]));for(const x of remote[k]||[])if(!map.has(x.id)||(x.updatedAt||0)>(map.get(x.id).updatedAt||0))map.set(x.id,x);state[k]=[...map.values()]}}
async function syncCloud(){if(!cloud||!user||readOnly)return;try{const {data,error}=await cloud.from('riji_documents').select('payload').eq('user_id',user.id).maybeSingle();if(error)throw error;if(data?.payload)merge(M.validate(data.payload));localStorage.setItem(M.KEY,JSON.stringify(state));const result=await cloud.from('riji_documents').upsert({user_id:user.id,payload:{...state,active:null},updated_at:new Date().toISOString()});if(result.error)throw result.error;cloudStatus='已同步 · '+time(Date.now());render()}catch(e){cloudStatus='云端同步未完成：'+e.message;toast('云端同步未完成，本地数据已保留')}}
async function importOldCloud(){if(!cloud||!user||state.legacy?.cloudUsers?.includes(user.id))return;const values=await Promise.all(['time_items','daily_tasks','daily_routines'].map(table=>cloud.from(table).select('*')));if(values.some(x=>x.error)){toast('旧云端数据读取未完成');return}const old={items:values[0].data.map(x=>({...x,start:Number(x.start),end:x.end==null?null:Number(x.end),estimateMin:x.estimate_min,updatedAt:Date.parse(x.updated_at)})),tasks:values[1].data.map(x=>({...x,doneDays:x.done_days,updatedAt:Date.parse(x.updated_at)})),routines:values[2].data};const migrated=M.migrate(old);for(const k of ['records','sessions'])for(const x of migrated[k])if(!state[k].some(r=>r.id===x.id))state[k].push(x);if(!state.active&&migrated.active&&!state.sessions.some(s=>s.id===migrated.active.id))state.active=migrated.active;state.legacy.cloudUsers=[...state.legacy.cloudUsers||[],user.id];persist();render()}
async function setupCloud(){if(!window.supabase)return;try{const cfg=JSON.parse(localStorage.getItem('little-dog-time-line-cloud-config-v1')||'null')||{url:'https://gsqtoclbvwdchwargsub.supabase.co',key:'sb_publishable_ka7LwBYMxpLg0Y-1NAU2MQ_6IIy_z0u'};cloud=window.supabase.createClient(cfg.url,cfg.key);cloud.auth.onAuthStateChange((event,session)=>{user=session?.user||null;if(user)setTimeout(async()=>{await importOldCloud();await syncCloud()},0)});const {data}=await cloud.auth.getSession();user=data.session?.user||null}catch(e){cloudStatus='云端暂不可用；数据保存在当前设备'}}
document.addEventListener('click',async e=>{const nav=e.target.closest('[data-view]');if(nav){view=nav.dataset.view;render();return}const pick=e.target.closest('[data-pick]');if(pick){const r=records().find(r=>r.id===pick.dataset.pick);if(pick.dataset.target==='today')mutate(()=>{r.category='待办';r.today[M.day(Date.now())]={done:r.done};r.updatedAt=Date.now()});else{name=r.text;taskId=r.id;render()}close();return}const preset=e.target.closest('[data-min]');if(preset){planned=+preset.dataset.min;render();return}const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action,id=b.dataset.id,r=records().find(r=>r.id===id);switch(action){
 case'add':add();break;case'close':close();break;case'record':recordMenu(id);break;case'edit':editRecord(id);break;case'settings':settings();break;case'backup':backup();break;case'restore':$('#restore').click();break;case'pickToday':picker('today');break;case'pickTimer':picker('timer');break;case'up':case'down':mode=action;render();break;case'start':start();break;
 case'pause':audioUnlock();mutate(()=>state.active.running?M.pause(state.active):M.resume(state.active));break;
 case'finish':{let s;if(mutate(()=>s=M.finish(state))&&s)editSession(s.id);break}case'session':editSession(id);break;
 case'deleteSession':if(confirm('删除这条行动记录？')){mutate(()=>{const s=state.sessions.find(x=>x.id===id);s.deletedAt=s.updatedAt=Date.now()});close()}break;
 case'time':if(state.active){toast('已有计时进行中');close();view='timer';render();break}name=r.text;taskId=r.id;view='timer';close();start();break;
 case'pin':mutate(()=>{r.pinned=!r.pinned;r.updatedAt=Date.now()});close();break;case'done':mutate(()=>M.complete(r,!r.done));close();break;
 case'today':mutate(()=>{const d=M.day(Date.now());if(r.today[d])delete r.today[d];else{r.today[d]={done:r.done};r.category='待办'}r.updatedAt=Date.now()});close();break;
 case'priority':mutate(()=>{r.priority=r.priority?0:1;r.updatedAt=Date.now()});close();break;case'moveUp':mutate(()=>{r.order=Math.min(...records().map(x=>x.order||x.createdAt))-1;r.updatedAt=Date.now()});close();break;
 case'delete':if(confirm('删除这条记录？关联计时记录仍保留。')){mutate(()=>r.deletedAt=r.updatedAt=Date.now());close()}break;
 case'prev':case'next':{const d=new Date(historyDay+'T12:00');d.setDate(d.getDate()+(action==='prev'?-1:1));historyDay=M.day(d);render();break}case'now':historyDay=M.day(Date.now());render();break;
 case'notification':if('Notification'in window){const p=await Notification.requestPermission();toast(p==='granted'?'已允许通知':'系统未允许通知')}else toast('当前浏览器不支持系统通知');break;
 case'login':if(!cloud){toast('云端服务暂不可用');break}openSheet('账号',`<label>邮箱</label><input name="email" type="email" autocomplete="username" required><label>密码</label><input name="password" type="password" autocomplete="current-password" minlength="6" required><div class="actions"><button class="primary">登录</button></div>`,async f=>{const result=await cloud.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(result.error)toast(result.error.message);else{close();toast('已登录')}});break;
 case'logout':await cloud.auth.signOut();user=null;close();break;case'sync':await syncCloud();settings();break}});
document.addEventListener('change',e=>{if(e.target.matches('[data-toggle]'))mutate(()=>{const r=records().find(r=>r.id===e.target.dataset.toggle);M.complete(r,e.target.checked)});if(e.target.id==='scope'){scope=e.target.value;render()}if(e.target.id==='filter'){filter=e.target.value;render()}if(e.target.id==='recordDay'){recordDay=e.target.value||M.day(Date.now());render()}if(e.target.id==='historyDay'){historyDay=e.target.value||M.day(Date.now());render()}if(e.target.id==='minutes'){planned=+e.target.value;tick()}});
document.addEventListener('input',e=>{if(e.target.matches('#app input[name=name]')&&!state.active){name=e.target.value;taskId=null}});
document.addEventListener('keydown',e=>{if(!$('#modal').hidden){if(e.key==='Escape')close();if(e.key==='Tab'){const els=[...$('#modal').querySelectorAll('button,input,textarea,select')].filter(x=>!x.disabled);if(e.shiftKey&&document.activeElement===els[0]){e.preventDefault();els.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===els.at(-1)){e.preventDefault();els[0].focus()}}}});
$('#restore').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{const raw=JSON.parse(await file.text()),incoming=raw.state?M.validate(raw.state):raw.version===2?M.validate(raw):M.migrate(Array.isArray(raw)?{items:raw}:raw);if(!raw.state&&raw.version!==2&&!Array.isArray(raw)&&!['items','tasks','routines','journalEntries'].some(k=>Array.isArray(raw[k])))throw Error('无法识别备份');if(!confirm('恢复将合并记录，并保留当前计时。是否继续？'))return;localStorage.setItem('riji-before-restore',JSON.stringify(state));merge(incoming);if(!state.active&&incoming.active&&!state.sessions.some(s=>s.id===incoming.active.id))state.active=incoming.active;state.legacy={...incoming.legacy,...state.legacy};readOnly=false;persist();close();render();toast('备份已合并恢复')}catch(err){toast('恢复失败：'+err.message)}finally{e.target.value=''}};
$('#timerPeek').onclick=()=>{view='timer';render()};window.addEventListener('storage',e=>{if(e.key===M.KEY&&e.newValue){try{state=M.validate(JSON.parse(e.newValue));render()}catch{}}});

if(window.visualViewport){const adjust=()=>{$('#modal').style.bottom=Math.max(0,window.innerHeight-visualViewport.height-visualViewport.offsetTop)+'px'};visualViewport.addEventListener('resize',adjust);visualViewport.addEventListener('scroll',adjust)}
