<style>
:root{--paper:#fff9f0;--sheet:#fffcf7;--ink:#38372f;--muted:#948a7b;--line:#e8dfd1;--pink:#ef927f;--mint:#89b99e;--lav:#afa5d1;--yellow:#edc26b;--blue:#98b9d1;--rail-x:110px;--minute:1.85px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:'Trebuchet MS','Hiragino Sans GB','PingFang SC','Microsoft YaHei',sans-serif;background:var(--paper);color:var(--ink)}
body{background-image:radial-gradient(#d7c9b744 .7px,transparent .7px);background-size:17px 17px}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid #7eaa9875;outline-offset:2px}
.app{max-width:980px;margin:0 auto;padding:23px 24px 27px}
.hero{position:relative;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:6px 3px 18px}.brand small{color:#a79b89;font-size:12px;letter-spacing:.15em}.brand h1{font-size:clamp(26px,3.3vw,38px);font-weight:750;letter-spacing:.06em;margin:5px 0 7px}.brand p{font-size:13px;color:var(--muted);margin:0}.dog-doodle{width:118px;height:102px;flex:0 0 auto;transform:rotate(-5deg);filter:drop-shadow(1px 4px 0 #eec3ad33)}
.panel{background:var(--sheet);border:2px solid #e8d8c7;border-radius:25px;box-shadow:4px 5px 0 #d8c8b533;overflow:hidden}
.controls{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:16px 21px 15px;border-bottom:2px dashed #e9dfd0}
.daynav{display:flex;gap:11px;align-items:center}.daynav button,.ghost{display:grid;place-items:center;border:1.5px solid #e2d6c5;background:#fff9f0;color:#544d43;border-radius:12px;width:36px;height:36px;min-width:36px;font-size:20px}.daynav button:disabled{opacity:.28;cursor:not-allowed}.datebox{min-width:150px;text-align:center}.datebox strong{font-size:16px}.datebox small{display:block;font-size:11px;color:var(--muted);margin-top:3px}
.now-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.go-now{border:1.5px solid #dfd1c1;background:#fff8ec;padding:8px 12px;border-radius:12px;color:#776b5c;font-size:12px}.go-now:hover{background:#f5eadb}
.record-btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-width:149px;min-height:45px;border:2px solid #403b34;background:#f0b6a7;box-shadow:3px 3px 0 #403b34;color:#332f2b;border-radius:13px;font-weight:750;font-size:15px;transition:transform .12s,box-shadow .12s}.record-btn:hover{background:#f2aa99}.record-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #403b34}.record-btn.active{background:#b9d8bf}.record-btn .circle-icon{width:11px;height:11px;border:2px solid currentColor;border-radius:100%}.record-btn.active .circle-icon{border-radius:3px;background:currentColor}
.ribbon{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:13px 22px;background:#fffdfa;border-bottom:1px solid #f0e5d8}.ribbon span{font-size:12px;color:#8a8072}.ribbon b{color:#3b6e5b;font-weight:700}.counter{font-variant-numeric:tabular-nums}.tiny-dash{display:inline-block;width:19px;border-top:3px dashed #c8bcac;vertical-align:middle;margin:0 5px}.tiny-solid{display:inline-block;width:18px;border-top:5px solid var(--mint);vertical-align:middle;margin:0 5px}
.timeline-viewport{height:min(65vh,680px);min-height:380px;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#dac7b2 transparent;background:linear-gradient(90deg,#fffaf1 0,#fffaf1 122px,#fffdf8 122px)}.timeline{height:2740px;position:relative;min-width:0}.rail{position:absolute;top:35px;bottom:35px;left:var(--rail-x);width:0;border-left:3px dashed #d7c9b7;transform:translateX(-50%);pointer-events:none}.hour-mark{position:absolute;left:0;right:0;height:0}.hour-time{position:absolute;left:15px;top:-10px;color:#9c8b79;font-size:12px;font-variant-numeric:tabular-nums;font-weight:700}.hour-tick{position:absolute;top:0;left:calc(var(--rail-x) - 8px);height:0;width:17px;border-top:1.5px solid #d8c5b3}.hour-mark.major .hour-time{color:#736957}.hour-mark.major .hour-tick{border-top-color:#af9b89}
.seg{position:absolute;left:var(--rail-x);width:13px;transform:translateX(-50%);border-radius:20px;border:1.5px solid #fcf7ed;box-shadow:0 0 0 1px #74685818;z-index:2;min-height:2px}.seg.active{animation:breathe 2.5s ease-in-out infinite alternate}.seg-start,.seg-end{position:absolute;left:var(--rail-x);width:13px;height:13px;transform:translateX(-50%);border:2px solid var(--sheet);border-radius:50%;z-index:3;pointer-events:none}.seg-start{margin-top:-5px}.seg-end{margin-top:-7px}@keyframes breathe{from{filter:saturate(.85)}to{filter:saturate(1.28)}}
.now-marker{position:absolute;left:0;right:0;height:0;pointer-events:none;z-index:7}.now-marker:before{content:'';position:absolute;left:var(--rail-x);right:0;top:0;border-top:1.5px dashed #e59a84;opacity:.85}.now-dot{position:absolute;left:var(--rail-x);top:0;width:22px;height:22px;border:5px solid #e99b85;background:#fffdf4;border-radius:100%;transform:translate(-50%,-50%);box-shadow:0 2px 0 #3e3a3220}.now-time{position:absolute;right:15px;top:-25px;background:#ffe8dc;border:1px solid #ebc5b2;border-radius:9px 9px 3px 9px;padding:3px 8px;color:#9c5b49;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.note-card{position:absolute;left:calc(var(--rail-x) + 30px);right:19px;z-index:5;min-height:83px;max-width:595px;padding:10px 12px 11px;background:#fffefa;border:1.5px solid #e3d7c7;border-left:5px solid var(--card-color,#e9b4a4);border-radius:13px;box-shadow:2px 3px 0 #ebdfd033;transition:border-color .15s}.note-card.active{background:#fbfff9;border-color:#b9d5c0}.note-card .card-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:#776d5f;flex-wrap:wrap}.note-card .card-top strong{font-size:12px;color:#454037}.card-title{display:flex;align-items:center;gap:6px;min-width:0}.card-status{font-size:11px;color:#5b927b}.card-remove{margin-left:auto;border:0;background:transparent;color:#b3a69a;font-size:18px;line-height:1;padding:0 2px}.card-remove:hover{color:#a64b3b}.note-card textarea{display:block;border:0;outline:0;resize:vertical;width:100%;height:41px;min-height:38px;max-height:180px;padding:7px 0 0;background:transparent;color:#423c34;font-size:14px;line-height:1.55}.note-card textarea:focus{outline:0}.note-card textarea::placeholder{color:#b8a99a}.empty-msg{position:absolute;left:calc(var(--rail-x) + 30px);right:19px;max-width:480px;color:#aa9385;background:#fffaf0;border:1.5px dashed #e5cabc;border-radius:12px;padding:13px 15px;font-size:13px;line-height:1.8}
.bottom{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap;margin:16px 6px 0;font-size:12px;color:#968574}.bottom details{position:relative}.bottom summary{cursor:pointer;list-style:none;border-bottom:1px dashed currentColor}.bottom summary::-webkit-details-marker{display:none}.backup-opts{display:flex;gap:8px;margin-top:10px}.backup-opts button,.backup-opts label{cursor:pointer;border:1px solid #d3c0aa;border-radius:8px;background:#fffaf2;color:#66584b;padding:7px 10px;font-size:12px}.backup-opts input{display:none}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,12px);z-index:100;pointer-events:none;background:#3f5549;color:white;border-radius:12px;padding:10px 15px;opacity:0;transition:.2s;font-size:13px;text-align:center;box-shadow:0 7px 24px #30281c30}.toast.show{opacity:1;transform:translate(-50%,0)}
.sync-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 21px;background:#f8f1e7;color:#796d5d;font-size:12px;border-bottom:1px solid #eee2d3}.sync-bar button{border:1px solid #c9b39d;border-radius:9px;background:#fffaf2;color:#665548;padding:6px 10px;font-size:12px;cursor:pointer}.sync-bar button:hover{background:#fff}.sync-bar.syncing #syncStatus{color:#aa7659}.sync-bar.online #syncStatus{color:#4f8a70}.sync-bar button:disabled{opacity:.6;cursor:wait}
@media(max-width:620px){:root{--rail-x:76px}.app{padding:13px 10px 24px}.hero{padding:2px 5px 11px}.brand h1{font-size:26px}.brand p{font-size:11px}.dog-doodle{width:87px;height:87px}.panel{border-radius:17px}.controls{padding:13px 12px;gap:8px}.datebox{min-width:120px}.datebox strong{font-size:14px}.daynav{gap:4px}.daynav button{width:31px;min-width:31px;height:33px}.now-actions{width:100%;justify-content:space-between}.record-btn{flex:1;min-width:0}.ribbon{padding:10px 12px}.ribbon .legend{font-size:10px}.timeline-viewport{height:calc(100dvh - 304px);min-height:370px;background:linear-gradient(90deg,#fffaf1 0,#fffaf1 88px,#fffdf8 88px)}.hour-time{left:9px;font-size:11px}.note-card{left:calc(var(--rail-x) + 19px);right:9px;padding:8px 9px;min-height:78px}.note-card textarea{font-size:13px}.now-time{right:9px}.empty-msg{left:calc(var(--rail-x) + 19px);right:9px}.bottom{margin:13px 5px;font-size:11px}.bottom .footer-note{max-width:54%}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}.seg.active{animation:none}}
</style>

<div class="app">
 <header class="hero">
   <div class="brand"><small>THE LITTLE TIME LINE</small><h1>日迹 <span aria-hidden="true" style="font-size:18px;color:#d19a88">⌁</span></h1><p>时间一直往前走，做过的事就留下颜色。</p></div>
   <svg class="dog-doodle" viewBox="0 0 130 118" aria-hidden="true" fill="none" stroke="#635448" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round"><path fill="#f9e5c7" d="M38 37Q18 18 14 42Q10 67 32 64Q33 89 56 94Q85 103 104 78Q114 62 105 42Q100 22 83 26Q61 20 38 37Z"/><path fill="#dcb69b" d="M38 37Q18 18 14 42Q10 67 32 64Q40 48 38 37Z"/><path fill="#dcb69b" d="M87 29Q103 13 119 35Q125 56 105 64Q109 42 87 29Z"/><path d="M52 58Q53 55 55 58M84 56Q85 53 87 57" stroke-width="4.5"/><path fill="#76594c" d="M67 65Q62 67 66 71Q72 75 75 68Q73 65 67 65Z"/><path d="M70 72Q69 81 61 77M70 72Q76 83 82 76"/><path d="M50 78Q45 79 41 76M90 78Q96 77 99 74" stroke-width="1.5"/><path fill="#edb7ad" stroke="none" d="M45 64q-9 4-1 9q9 0 9-5ZM92 65q-8 4-1 9q9-1 9-5Z"/><path d="M53 95Q42 106 55 108M84 95Q95 110 80 110"/><path d="M110 85q15-14 14 3q-4 12-15 3" stroke-width="2.5"/><path d="M20 9l4 9M38 6l-2 10M116 12l-6 8" stroke="#d39c72" stroke-width="2.5"/></svg>
 </header>
 <main class="panel">
  <div class="controls">
   <div class="daynav"><button id="prevDay" title="前一天" aria-label="前一天">‹</button><div class="datebox"><strong id="dayTitle"></strong><small id="daySub"></small></div><button id="nextDay" title="后一天" aria-label="后一天">›</button></div>
   <div class="now-actions"><button id="goNow" class="go-now">↳ 回到现在</button><button id="recordBtn" class="record-btn"><span class="circle-icon"></span><span id="recordLabel">开始记录</span></button></div>
  </div>
  <div class="sync-bar" id="syncBar"><span id="syncStatus">仅保存在当前设备</span><button id="syncBtn" type="button">开启跨设备同步</button></div>
  <div class="ribbon"><span id="summary">还没有留下记录</span><span class="legend"><i class="tiny-dash"></i>没记录 <i class="tiny-solid"></i>记录中 / 已完成</span></div>
  <div class="timeline-viewport" id="viewport" aria-label="24小时时间线"><div class="timeline" id="timeline"><div class="rail"></div><div id="hours"></div><div id="segments"></div><div id="cards"></div><div class="now-marker" id="nowMarker"><span class="now-dot"></span><span class="now-time" id="nowTime"></span></div></div></div>
 </main>
 <footer class="bottom"><span class="footer-note">✿ 点开始，时间就会变成彩色实线。什么时候写内容都行。</span><details><summary>备份 / 恢复记录</summary><div class="backup-opts"><button id="exportBtn">导出 JSON</button><label>导入 JSON<input type="file" id="importInput" accept="application/json,.json"></label></div></details></footer>
</div><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
'use strict';
const KEY='little-dog-time-line-data-v1';
const CLOUD_KEY='little-dog-time-line-cloud-config-v1';
const COLORS=['#92bba3','#f1b09e','#b5a8d4','#edca83','#a6c4d9','#d9aabc'];
const PX=1.85, PAD=35, TOTAL=PAD*2+PX*1440;
const $=id=>document.getElementById(id);
const E={viewport:$('viewport'),timeline:$('timeline'),hours:$('hours'),segments:$('segments'),cards:$('cards'),nowMarker:$('nowMarker'),nowTime:$('nowTime'),recordBtn:$('recordBtn'),recordLabel:$('recordLabel'),dayTitle:$('dayTitle'),daySub:$('daySub'),summary:$('summary'),nextDay:$('nextDay'),toast:$('toast'),syncBar:$('syncBar'),syncStatus:$('syncStatus'),syncBtn:$('syncBtn')};
let items=[],currentDay=dayKey(new Date()),storageOK=true,toastTimer=0,autoFollow=true,cloud=null,cloudUser=null,syncTimer=0;
const dayNames=['周日','周一','周二','周三','周四','周五','周六'];
function dayKey(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function fromDayKey(key){const [y,m,d]=key.split('-').map(Number);return new Date(y,m-1,d)}
function advanceDay(key,n){const date=fromDayKey(key);date.setDate(date.getDate()+n);return dayKey(date)}
function isToday(){return currentDay===dayKey(new Date())}
function getMidnight(day){return fromDayKey(day).getTime()}
function minuteOfDay(t,day){const d=new Date(t); if(dayKey(d)===day)return d.getHours()*60+d.getMinutes()+d.getSeconds()/60+d.getMilliseconds()/60000;return (t-getMidnight(day))/60000}
function clock(ms){const d=new Date(ms);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function formatDuration(ms){const mins=Math.max(0,Math.floor(ms/60000));if(mins<1)return '不到 1 分钟';const h=Math.floor(mins/60),m=mins%60;return h?(h+' 小时'+(m?' '+m+' 分钟':'')):(m+' 分钟')}
function safeAttr(s){return String(s??'').replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll("'",'&#39;')}
function toast(msg){clearTimeout(toastTimer);E.toast.textContent=msg;E.toast.classList.add('show');toastTimer=setTimeout(()=>E.toast.classList.remove('show'),2300)}
function cloudConfig(){try{return JSON.parse(localStorage.getItem(CLOUD_KEY)||'null')}catch(e){return null}}
function cloudReady(){return !!(cloud&&cloudUser)}
function updateSyncUI(text){E.syncStatus.textContent=text||(!cloud?'仅保存在当前设备':cloudUser?'已同步 · '+(cloudUser.email||'当前账号'):'已配置，点击登录');E.syncBar.classList.toggle('online',cloudReady());E.syncBar.classList.toggle('syncing',text==='同步中…');E.syncBtn.textContent=cloudUser?'退出同步':cloud?'登录同步':'开启跨设备同步'}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify({version:1,items}));storageOK=true;return true}catch(e){storageOK=false;toast('浏览器无法保存，请用右下角导出备份');return false}}
function queueCloudSync(){if(!cloudReady())return;clearTimeout(syncTimer);syncTimer=setTimeout(syncToCloud,450)}
async function syncToCloud(){if(!cloudReady())return;updateSyncUI('同步中…');const rows=items.map(x=>({id:x.id,user_id:cloudUser.id,start:x.start,end:x.end,note:x.note,color:x.color,updated_at:new Date(x.updatedAt||Date.now()).toISOString()}));const {error}=await cloud.from('time_items').upsert(rows);if(error)toast('云端同步失败：'+error.message);updateSyncUI(error?'同步失败':'已同步 · '+(cloudUser.email||'当前账号'))}
async function syncFromCloud(){if(!cloudReady())return;updateSyncUI('同步中…');const {data,error}=await cloud.from('time_items').select('id,start,end,note,color,updated_at').order('start');if(error){toast('读取云端失败：'+error.message);updateSyncUI('同步失败');return}const localById=new Map(items.map(x=>[x.id,x]));for(const row of data||[]){const remote={id:String(row.id),start:Number(row.start),end:row.end==null?null:Number(row.end),note:String(row.note||''),color:COLORS.includes(row.color)?row.color:COLORS[0],updatedAt:Date.parse(row.updated_at)||0};const local=localById.get(remote.id);if(!local||remote.updatedAt>(local.updatedAt||0))localById.set(remote.id,remote)}items=Array.from(localById.values()).filter(x=>x&&Number.isFinite(x.start));saveLocal();render();await syncToCloud();}
function load(){try{const raw=localStorage.getItem(KEY);if(raw){const data=JSON.parse(raw);const records=Array.isArray(data)?data:data.items;if(Array.isArray(records))items=records.filter(x=>x&&typeof x.id==='string'&&Number.isFinite(x.start)&&(!x.end||Number.isFinite(x.end))).map(x=>({id:x.id,start:x.start,end:x.end||null,note:typeof x.note==='string'?x.note:'',color:COLORS.includes(x.color)?x.color:COLORS[0],updatedAt:Number(x.updatedAt)||0}));}}catch(e){storageOK=false;toast('本地存储暂不可用，请记得导出备份')}}
function save(){const ok=saveLocal();if(ok)queueCloudSync();return ok}
function activeItem(){return items.find(item=>item.end===null)||null}
function intersects(item,day){const from=getMidnight(day),to=getMidnight(advanceDay(day,1)),end=item.end??Date.now();return item.start<to&&end>=from}
function segmentsOnDay(){return items.filter(it=>intersects(it,currentDay)).sort((a,b)=>a.start-b.start)}
function renderHours(){E.timeline.style.height=TOTAL+'px';E.hours.innerHTML='';const frag=document.createDocumentFragment();for(let h=0;h<=24;h++){const el=document.createElement('div');el.className='hour-mark'+(h%3===0?' major':'');el.style.top=(PAD+h*60*PX)+'px';el.innerHTML='<span class="hour-time">'+String(h).padStart(2,'0')+':00</span><span class="hour-tick"></span>';frag.appendChild(el)}E.hours.appendChild(frag)}
function updateDayHeader(){const date=fromDayKey(currentDay);E.dayTitle.textContent=(date.getMonth()+1)+'月'+date.getDate()+'日 · '+dayNames[date.getDay()];E.daySub.textContent=date.getFullYear()+' 年'+(isToday()?' · 今天':' · 以前的日子');E.nextDay.disabled=currentDay>=dayKey(new Date())}
function updateControls(){const active=activeItem();E.recordBtn.disabled=!isToday();E.recordBtn.classList.toggle('active',!!active);E.recordLabel.textContent=active?'结束记录':'开始记录';E.recordBtn.title=isToday()?'':'只能记录当下，点「回到现在」即可继续';if(!isToday())E.recordLabel.textContent='回到今天可记录'}
function updateSummary(){const day=segmentsOnDay(),from=getMidnight(currentDay),to=getMidnight(advanceDay(currentDay,1));let total=0;for(const item of day)total+=Math.max(0,Math.min(item.end??Date.now(),to)-Math.max(item.start,from));E.summary.innerHTML=day.length?'今天留下了 <b>'+day.length+'</b> 段颜色 · 共 <b>'+formatDuration(total)+'</b>':'今天还没有记录 · 从现在开始也不晚'}
function clamp(x,a,b){return Math.max(a,Math.min(x,b))}
function renderCardsAndSegments(){const day=segmentsOnDay(),startMs=getMidnight(currentDay),endMs=getMidnight(advanceDay(currentDay,1)),now=Date.now();E.segments.innerHTML='';E.cards.innerHTML='';const parts=document.createDocumentFragment(),cards=document.createDocumentFragment();let lowestCardTop=-100;
 for(let i=0;i<day.length;i++){
  const it=day[i],end=it.end??now;
  const sy=PAD+clamp(minuteOfDay(Math.max(it.start,startMs),currentDay),0,1440)*PX;
  const ey=PAD+clamp(minuteOfDay(Math.min(end,endMs),currentDay),0,1440)*PX;
  const seg=document.createElement('div');seg.className='seg'+(it.end===null?' active':'');seg.style.background=it.color;seg.style.top=sy+'px';seg.style.height=Math.max(3,ey-sy)+'px';seg.dataset.segmentId=it.id;parts.appendChild(seg);
  const p=document.createElement('span');p.className='seg-start';p.style.top=sy+'px';p.style.background=it.color;parts.appendChild(p);
  if(it.end!==null){const p2=document.createElement('span');p2.className='seg-end';p2.style.top=ey+'px';p2.style.background=it.color;parts.appendChild(p2)}
  let cardTop=Math.max(sy-8,ey-70,lowestCardTop+88);cardTop=Math.min(cardTop,TOTAL-110);lowestCardTop=cardTop;
  const note=document.createElement('section');note.className='note-card'+(it.end===null?' active':'');note.style.setProperty('--card-color',it.color);note.style.top=cardTop+'px';note.dataset.cardId=it.id;
  const endLabel=it.end===null?'进行中':clock(it.end);
  note.innerHTML='<div class="card-top"><span class="card-title"><strong>'+clock(it.start)+' → <span data-end-id="'+safeAttr(it.id)+'">'+endLabel+'</span></strong><span class="card-status" data-duration-id="'+safeAttr(it.id)+'">'+(it.end===null?formatDuration(now-it.start):'')+'</span></span><button class="card-remove" title="删除这一段记录" aria-label="删除这一段记录" data-remove="'+safeAttr(it.id)+'">×</button></div><textarea spellcheck="false" data-note-id="'+safeAttr(it.id)+'" placeholder="这段时间做了什么？现在或以后再写…" aria-label="记录这段时间做了什么"></textarea>';
  note.querySelector('textarea').value=it.note;
  cards.appendChild(note);
 }
 E.segments.appendChild(parts);E.cards.appendChild(cards);
 if(day.length===0){const message=document.createElement('div');message.className='empty-msg';const pos=isToday()?clamp(PAD+minuteOfDay(Date.now(),currentDay)*PX+35,60,TOTAL-130):Math.min(TOTAL-120,Math.max(120,PAD+600*PX));message.style.top=pos+'px';message.textContent='这一段时间还是虚线。按下「开始记录」，颜色就会从现在慢慢往下长出来。';E.cards.appendChild(message)}
 updateSummary();updateControls();updateNow(false)
}
function updateNow(follow){const now=Date.now(),sameDay=isToday();E.nowMarker.style.display=sameDay?'block':'none';if(sameDay){const pos=PAD+clamp(minuteOfDay(now,currentDay),0,1440)*PX;E.nowMarker.style.top=pos+'px';E.nowTime.textContent=clock(now);if(follow){autoFollow=true;E.viewport.scrollTo({top:clamp(pos-E.viewport.clientHeight*.39,0,E.viewport.scrollHeight-E.viewport.clientHeight),behavior:'smooth'})}else if(autoFollow&&pos-E.viewport.scrollTop>E.viewport.clientHeight*.82){E.viewport.scrollTop=clamp(pos-E.viewport.clientHeight*.45,0,E.viewport.scrollHeight-E.viewport.clientHeight)}}
 const active=activeItem();if(active){const seg=Array.from(E.segments.children).find(el=>el.dataset.segmentId===active.id);if(seg&&sameDay){let y=PAD+clamp(minuteOfDay(Math.max(active.start,getMidnight(currentDay)),currentDay),0,1440)*PX;seg.style.height=Math.max(3,PAD+clamp(minuteOfDay(now,currentDay),0,1440)*PX-y)+'px'}const activeCard=E.cards.querySelector('[data-card-id="'+CSS.escape(active.id)+'"]');if(activeCard&&sameDay){const list=Array.from(E.cards.querySelectorAll('.note-card'));const previous=list.length>1?parseFloat(list[list.length-2].style.top)+88:-100;const currentY=PAD+clamp(minuteOfDay(now,currentDay),0,1440)*PX;activeCard.style.top=clamp(Math.max(currentY-70,previous),0,TOTAL-110)+'px'}const dur=E.cards.querySelector('[data-duration-id="'+CSS.escape(active.id)+'"]');if(dur)dur.textContent=formatDuration(now-active.start)}
 if(!window.__tlLatestSummary||now-window.__tlLatestSummary>55000){updateSummary();window.__tlLatestSummary=now}
 if(currentDay!==dayKey(new Date())&&active&&currentDay===advanceDay(dayKey(new Date()),-1)){/* day boundary: leave old day visible until returning to today */}
}
function render(opts){const options=opts||{},oldScroll=E.viewport.scrollTop;updateDayHeader();renderCardsAndSegments();if(options.follow){requestAnimationFrame(()=>updateNow(true))}else E.viewport.scrollTop=oldScroll}
function startOrEnd(){if(!isToday()){currentDay=dayKey(new Date());render({follow:true});return}const active=activeItem(),now=Date.now();if(active){active.end=now;active.updatedAt=now;const stored=save();render();toast(stored?'已结束，这段时间留下颜色啦':'已结束，但保存失败，请导出备份');if(!active.note){requestAnimationFrame(()=>{const t=E.cards.querySelector('[data-note-id="'+CSS.escape(active.id)+'"]');if(t)t.focus({preventScroll:true})})}}
 else{const id='t'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8);items.push({id,start:now,end:null,note:'',color:COLORS[items.length%COLORS.length],updatedAt:now});const stored=save();render({follow:true});toast(stored?'开始啦！之后再写做了什么也可以':'记录开始，但保存失败，请导出备份')}}
function changeDay(n){currentDay=advanceDay(currentDay,n);if(currentDay>dayKey(new Date()))currentDay=dayKey(new Date());render({follow:isToday()})}
E.viewport.addEventListener('wheel',()=>autoFollow=false,{passive:true});E.viewport.addEventListener('touchstart',()=>autoFollow=false,{passive:true});
$('prevDay').addEventListener('click',()=>changeDay(-1));E.nextDay.addEventListener('click',()=>changeDay(1));$('goNow').addEventListener('click',()=>{currentDay=dayKey(new Date());render({follow:true})});E.recordBtn.addEventListener('click',startOrEnd);
E.cards.addEventListener('input',e=>{const input=e.target;if(!input.matches('textarea[data-note-id]'))return;const it=items.find(x=>x.id===input.dataset.noteId);if(!it)return;it.note=input.value;it.updatedAt=Date.now();save();/* IMPORTANT: never rerender during typing or blur */});
E.cards.addEventListener('blur',e=>{const input=e.target;if(!input.matches('textarea[data-note-id]'))return;const it=items.find(x=>x.id===input.dataset.noteId);if(!it)return;it.note=input.value;it.updatedAt=Date.now();save()},true);
E.cards.addEventListener('click',async e=>{const btn=e.target.closest('[data-remove]');if(!btn)return;const it=items.find(x=>x.id===btn.dataset.remove);if(!it)return;if(!confirm('要删除 '+clock(it.start)+' 开始的这段记录吗？'))return;items=items.filter(x=>x.id!==it.id);save();if(cloudReady())await cloud.from('time_items').delete().eq('id',it.id).eq('user_id',cloudUser.id);render();toast('这一段记录已删除')});
$('exportBtn').addEventListener('click',()=>{const data=JSON.stringify({app:'小狗时间线',version:1,exportedAt:new Date().toISOString(),items},null,2);const blob=new Blob([data],{type:'application/json;charset=utf-8'});const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download='日迹备份_'+dayKey(new Date())+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('备份已导出')});
$('importInput').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{const raw=JSON.parse(await f.text());const records=Array.isArray(raw)?raw:raw.items;if(!Array.isArray(records)||records.some(x=>!x||!x.id||!Number.isFinite(x.start)||x.end!==null&&x.end!==undefined&&!Number.isFinite(x.end)))throw Error('文件格式不正确');if(!confirm('导入会替换软件里现有的记录。确定继续吗？'))return;items=records.map(x=>({id:String(x.id),start:x.start,end:x.end??null,note:String(x.note||''),color:COLORS.includes(x.color)?x.color:COLORS[0],updatedAt:Date.now()}));save();currentDay=dayKey(new Date());render({follow:true});toast('记录已恢复，共 '+items.length+' 段')}catch(err){toast('无法导入：'+err.message)}finally{e.target.value=''}});
async function setupCloud(){const cfg=cloudConfig();if(!cfg?.url||!cfg?.key||!window.supabase){updateSyncUI();return}cloud=window.supabase.createClient(cfg.url,cfg.key);cloud.auth.onAuthStateChange((event,session)=>{cloudUser=session?.user||null;updateSyncUI();if(cloudUser&&event!=='SIGNED_OUT')setTimeout(syncFromCloud,0)});const {data}=await cloud.auth.getSession();cloudUser=data?.session?.user||null;updateSyncUI()}
E.syncBtn.addEventListener('click',async()=>{if(cloudUser){await cloud.auth.signOut();cloudUser=null;updateSyncUI('仅保存在当前设备');toast('已退出云端同步');return}let cfg=cloudConfig();if(!cfg?.url||!cfg?.key){const url=prompt('输入 Supabase Project URL');const key=prompt('输入 Supabase anon public key');if(!url||!key)return;cfg={url:url.trim(),key:key.trim()};localStorage.setItem(CLOUD_KEY,JSON.stringify(cfg));await setupCloud()}if(!cloud){toast('同步配置不可用');return}const email=prompt('输入邮箱，登录链接会发送到这个邮箱');if(!email)return;const {error}=await cloud.auth.signInWithOtp({email:email.trim(),options:{emailRedirectTo:location.href}});toast(error?'登录失败：'+error.message:'登录链接已发送，请打开邮箱完成登录')});
load();renderHours();render({follow:true});setupCloud();setInterval(()=>{const nowDay=dayKey(new Date());if(currentDay===advanceDay(nowDay,-1)&&E.recordBtn.classList.contains('active')){currentDay=nowDay;render({follow:true})}else if(isToday())updateNow(false);else if(E.nextDay.disabled)updateDayHeader()},1000);
if(!storageOK)toast('当前浏览器存储不可用，记得导出备份');
})();
</script>
</body></html>
